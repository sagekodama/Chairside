<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chairside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2F4; --surface:#F6F9FB; --ink:#233642; --muted:#6B7E8A; --line:#E1E9EC;
  --accent:#1A9483; --accent-ink:#FFFFFF; --accent-soft:#E4F4F0;
  --urgent:#CF574C; --urgent-soft:#F9EAE7;
  --nu-d:rgba(180,197,205,.45); --nu-l:rgba(255,255,255,.95);
  --shadow:6px 6px 14px var(--nu-d), -6px -6px 14px var(--nu-l);
  --shadow-sm:3px 3px 8px var(--nu-d), -3px -3px 8px var(--nu-l);
  --inset:inset 3px 3px 7px var(--nu-d), inset -3px -3px 7px var(--nu-l);
  --inset-sm:inset 2px 2px 4px var(--nu-d), inset -2px -2px 4px var(--nu-l);
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#3E5170; --surface:#485C7E; --ink:#EEF1F7; --muted:#AEB9CC;
    --line:rgba(255,255,255,.1); --accent:#F4A9C6; --accent-ink:#3A1526; --accent-soft:#533B49;
    --urgent:#FF8B7E; --urgent-soft:#472C2A;
    --nu-d:rgba(0,0,0,.3); --nu-l:rgba(255,255,255,.07);
    --shadow:6px 6px 14px var(--nu-d), -6px -6px 14px var(--nu-l);
    --shadow-sm:3px 3px 8px var(--nu-d), -3px -3px 8px var(--nu-l);
    --inset:inset 3px 3px 7px var(--nu-d), inset -3px -3px 7px var(--nu-l);
    --inset-sm:inset 2px 2px 4px var(--nu-d), inset -2px -2px 4px var(--nu-l);
  }
}
:root[data-theme="dark"]{
  --bg:#3E5170; --surface:#485C7E; --ink:#EEF1F7; --muted:#AEB9CC;
  --line:rgba(255,255,255,.1); --accent:#F4A9C6; --accent-ink:#3A1526; --accent-soft:#533B49;
  --urgent:#FF8B7E; --urgent-soft:#472C2A;
  --nu-d:rgba(0,0,0,.3); --nu-l:rgba(255,255,255,.07);
  --shadow:6px 6px 14px var(--nu-d), -6px -6px 14px var(--nu-l);
  --shadow-sm:3px 3px 8px var(--nu-d), -3px -3px 8px var(--nu-l);
  --inset:inset 3px 3px 7px var(--nu-d), inset -3px -3px 7px var(--nu-l);
  --inset-sm:inset 2px 2px 4px var(--nu-d), inset -2px -2px 4px var(--nu-l);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}

.app{max-width:560px;margin:0 auto;padding:20px 16px 150px;}
header{padding:8px 4px 14px;}
.date{color:var(--muted);font-size:14px;margin:0 0 2px;}
h1{font-family:var(--head);font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1.1;margin:0;}
.summary{margin:6px 0 0;color:var(--muted);font-size:15px;}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px;}
.chip{border:0;background:var(--surface);border-radius:999px;padding:8px 15px;font-size:14px;font-weight:500;color:var(--muted);box-shadow:var(--shadow-sm);transition:box-shadow .13s ease,color .13s ease;}
.chip[aria-pressed="true"]{background:var(--bg);color:var(--accent);box-shadow:var(--inset-sm);}

.card{background:var(--surface);border:0;border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.card-top[data-a="collapse"]{cursor:pointer;}
.ctright{display:flex;align-items:center;gap:8px;flex:none;}
.chevbtn{border:0;background:none;color:var(--muted);padding:2px;display:grid;place-items:center;}
.chevbtn svg{width:22px;height:22px;}
.chev{transition:transform .16s ease;}
.is-collapsed .chev{transform:rotate(-90deg);}
.collapse-all{display:flex;justify-content:flex-end;margin:-2px 2px 12px;}
.sec{border:0;border-radius:14px;margin-bottom:10px;background:var(--bg);box-shadow:var(--inset-sm);}
.sec.sdone{box-shadow:var(--inset-sm),inset 0 0 0 1.5px var(--accent);}
.sec-head{display:flex;align-items:center;gap:12px;padding:11px 12px;}
.sec-check{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin:0;border:0;border-radius:9px;display:grid;place-content:center;background:var(--surface);box-shadow:var(--inset-sm);cursor:pointer;transition:box-shadow .13s ease;}
.sec-check::after{content:"";width:12px;height:7px;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px) scale(0);}
.sec-check:checked{background:var(--accent);box-shadow:var(--shadow-sm);}
.sec-check:checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1);}
.sec-title{flex:1;display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left;font-family:var(--head);font-weight:600;font-size:16px;color:var(--ink);cursor:pointer;min-height:26px;}
.sec-name{flex:1;}
.sec.sdone .sec-name{color:var(--muted);text-decoration:line-through;}
.sec-count{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;}
.sec-count.solo{font-weight:500;font-style:italic;opacity:.8;}
.secchev{display:grid;place-items:center;color:var(--muted);transition:transform .16s ease;transform:rotate(-90deg);}
.secchev svg{width:20px;height:20px;}
.sec.is-open .secchev{transform:rotate(0);}
.tasks.subtasks{padding:2px 10px 4px 46px;}
.subtasks .task{padding:8px 0;}
.inline-add.sub{padding:0 10px 12px 46px;}
.link.addtask{display:inline-block;padding:2px 12px 12px 46px;}
.pvwrap .pvsec{margin-bottom:12px;}
.pvsec-title{font-family:var(--head);font-weight:700;font-size:13px;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.03em;}
.pname{font-family:var(--head);font-weight:600;font-size:20px;letter-spacing:-.01em;margin:0;}
.pmeta{color:var(--muted);font-size:14px;margin:2px 0 0;}
.count{font-size:13px;font-weight:600;color:var(--accent);background:var(--surface);border-radius:999px;padding:4px 11px;white-space:nowrap;box-shadow:var(--shadow-sm);}
.count.done{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-sm);}
.bar{display:flex;gap:2px;margin:12px 0 6px;padding:3px;border-radius:8px;background:var(--bg);box-shadow:var(--inset-sm);}
.bar i{flex:1;height:6px;border-radius:3px;background:transparent;}
.bar i.on{background:var(--accent);}

.tasks{list-style:none;margin:0;padding:0;}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);}
.task:first-child{border-top:0;}
.task label{display:flex;gap:12px;align-items:flex-start;flex:1;cursor:pointer;min-height:28px;}
.task input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:0;border:0;border-radius:8px;display:grid;place-content:center;background:var(--surface);box-shadow:var(--inset-sm);cursor:pointer;}
.task input[type=checkbox]::after{content:"";width:12px;height:7px;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px) scale(0);transition:transform .12s ease;}
.task input[type=checkbox]:checked{background:var(--accent);box-shadow:var(--shadow-sm);}
.task input[type=checkbox]:checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1);}
.ttext{flex:1;padding-top:1px;}
.task.done .ttext{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted);}
.role{flex:none;font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;margin-top:2px;}
.role.assistant{background:var(--accent-soft);color:var(--accent);}
.role.front{background:var(--line);color:var(--muted);}
.xbtn{flex:none;border:0;background:none;color:var(--muted);padding:2px 6px;font-size:18px;line-height:1;border-radius:6px;}

.card-actions{display:flex;gap:12px;align-items:center;margin-top:6px;padding-top:10px;border-top:1px solid var(--line);}
.move{display:flex;gap:6px;}
.mvbtn{border:0;background:var(--surface);width:38px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--ink);box-shadow:var(--shadow-sm);transition:box-shadow .12s ease;}
.mvbtn:active{box-shadow:var(--inset-sm);}
.mvbtn svg{width:18px;height:18px;}
.mvbtn:disabled{opacity:.4;box-shadow:none;}
.link{border:0;background:none;padding:4px 0;color:var(--accent);font-weight:600;font-size:14px;}
.link.quiet{color:var(--muted);font-weight:500;}
.inline-add{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.inline-add input[type=text]{flex:1 1 180px;}

input[type=text],input[type=tel],input[type=time],textarea,select{width:100%;background:var(--bg);border:0;border-radius:12px;padding:12px 14px;box-shadow:var(--inset-sm);}
textarea{min-height:110px;resize:vertical;}
select{width:auto;}
label.field{display:block;font-weight:600;font-size:14px;margin:16px 0 6px;}
.hint{font-weight:400;color:var(--muted);}

.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink);box-shadow:4px 4px 10px var(--nu-d),-4px -4px 10px var(--nu-l);transition:box-shadow .12s ease;}
.btn:active{box-shadow:inset 3px 3px 7px rgba(0,0,0,.2),inset -2px -2px 5px rgba(255,255,255,.14);}
.btn.block{width:100%;margin-top:20px;}
.btn.ghost{background:var(--surface);color:var(--ink);border:0;box-shadow:var(--shadow-sm);}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;}

.empty{text-align:center;color:var(--muted);padding:44px 24px;border:0;border-radius:18px;background:var(--bg);box-shadow:var(--inset-sm);}
.empty strong{display:block;color:var(--ink);font-family:var(--head);font-size:19px;margin-bottom:4px;}

/* messages */
.msg{border-left:5px solid var(--accent);}
.msg.urgent{border-left-color:var(--urgent);}
.msg.relayed{opacity:.72;}
.badge{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--urgent-soft);color:var(--urgent);margin-left:8px;vertical-align:2px;}
.mbody{margin:10px 0 4px;white-space:pre-wrap;}
.mcontact a{color:var(--accent);font-weight:600;text-decoration:none;}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
.mrow .btn{padding:9px 14px;font-size:14px;}

/* nav + fab */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 -6px 18px var(--nu-d);}
.tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.tab{border:0;background:none;padding:9px 4px;border-radius:14px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:14px;position:relative;transition:box-shadow .13s ease,color .13s ease;}
.tab[aria-selected="true"]{color:var(--accent);background:var(--bg);box-shadow:var(--inset-sm);}
.tab svg{width:22px;height:22px;}
.pip{position:absolute;top:6px;right:22%;min-width:18px;height:18px;border-radius:9px;background:var(--urgent);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(86px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:22px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:6px 6px 16px var(--nu-d),-5px -5px 14px var(--nu-l);display:grid;place-items:center;z-index:19;transition:box-shadow .12s ease;}
.fab:active{box-shadow:inset 3px 3px 8px rgba(0,0,0,.25),inset -2px -2px 6px rgba(255,255,255,.14);}
.fab svg{width:28px;height:28px;}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,28,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease;box-shadow:0 -12px 44px rgba(20,40,55,.22);}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;}
.sheet h2{font-family:var(--head);font-size:22px;margin:0;letter-spacing:-.01em;}
.close{border:0;background:var(--surface);width:38px;height:38px;border-radius:12px;font-size:20px;color:var(--muted);box-shadow:var(--shadow-sm);transition:box-shadow .12s ease;}
.close:active{box-shadow:var(--inset-sm);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.preview{list-style:none;margin:0;padding:0;border:0;border-radius:14px;background:var(--bg);box-shadow:var(--inset-sm);overflow:hidden;}
.preview li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);}
.preview li:first-child{border-top:0;}
.preview label{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer;}
.preview input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin:0;}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.seg button{border:0;background:var(--surface);border-radius:12px;padding:12px;font-weight:600;color:var(--muted);box-shadow:var(--shadow-sm);transition:box-shadow .12s ease;}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--accent);box-shadow:var(--inset-sm);}
.seg button.u[aria-pressed="true"]{background:var(--bg);color:var(--urgent);box-shadow:var(--inset-sm);}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;z-index:60;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);}
.toast button{border:0;background:none;color:var(--accent);font-weight:700;padding:0;filter:brightness(1.25);}
.privacy{color:var(--muted);font-size:13px;text-align:center;margin:22px 12px 0;}
.privacy .link{font-size:13px;}
#auth{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));}
.authbox{width:100%;max-width:380px;}
.authbox .card{padding:26px 22px;}
.auth-title{font-family:var(--head);font-weight:700;font-size:30px;letter-spacing:-.02em;margin:0;color:var(--ink);}
.auth-sub{color:var(--muted);font-size:15px;margin:4px 0 6px;}
.auth-err{color:var(--urgent);font-size:14px;font-weight:600;margin:12px 0 0;}
.auth-line{text-align:center;color:var(--muted);font-size:14px;margin:14px 0 0;}
body.pre-auth{overflow:hidden;}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:40px;}
.hrow .date{margin:0;}
.hbtns{display:flex;gap:6px;}
.ibtn{border:0;background:var(--surface);width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--ink);box-shadow:var(--shadow-sm);transition:box-shadow .12s ease;}
.ibtn:active{box-shadow:var(--inset-sm);}
.ibtn svg{width:20px;height:20px;}
.ibtn.acc{color:var(--accent);}
.backtoday{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 13px;font-weight:600;font-size:13px;margin-top:8px;box-shadow:var(--shadow-sm);}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;}
.cal-title{font-family:var(--head);font-weight:600;font-size:19px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;color:var(--muted);font-size:12px;font-weight:600;padding:4px 0;}
.cal-day{aspect-ratio:1;border:0;background:var(--surface);border-radius:12px;font-weight:500;position:relative;display:grid;place-items:center;padding:0;box-shadow:var(--shadow-sm);}
.cal-day.blank{background:none;pointer-events:none;box-shadow:none;}
.cal-day.today{color:var(--accent);font-weight:700;box-shadow:var(--inset-sm);}
.cal-day.sel{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-sm);}
.cal-day.has::after{content:"";position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--accent);}
.cal-day.sel.has::after{background:var(--accent-ink);}
.cal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:13px;}
.hrow .date{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:2px;}
.tbtn{flex:none;display:flex;align-items:center;gap:7px;border:0;background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px 8px 12px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;box-shadow:var(--shadow-sm);transition:box-shadow .12s ease;}
.tbtn:active{box-shadow:var(--inset-sm);}
.tbtn svg{width:18px;height:18px;flex:none;}
.tbtn.run{background:var(--accent-soft);border-color:transparent;color:var(--accent);}
.tbtn.done{background:var(--urgent);border-color:transparent;color:#fff;}
.tcard{margin-bottom:12px;}
.tname{font-family:var(--head);font-weight:600;font-size:18px;margin:0;}
.tbig{font-family:var(--head);font-weight:700;font-size:52px;letter-spacing:-.02em;line-height:1.1;margin:8px 0 2px;font-variant-numeric:tabular-nums;}
.tbig.done{color:var(--urgent);}
.tbar{height:10px;border-radius:5px;background:var(--bg);box-shadow:var(--inset-sm);overflow:hidden;margin:10px 0 6px;}
.tbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;}
.tstat{color:var(--muted);font-size:14px;margin:0 0 4px;}
.tsteps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.tstep span{font-size:13px;color:var(--muted);font-weight:600;}
.tstep.on span,.tstep.done span{color:var(--accent);}
.tstep .tbar{margin:6px 0 0;}
.tcard.alarm{border-color:var(--urgent);background:var(--urgent-soft);}
.talert em{font-style:normal;font-weight:700;}
.tbtns{display:flex;gap:10px;margin-top:16px;}
.tbtns .btn{flex:1;}
#alerts{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);max-width:536px;margin:0 auto;z-index:70;display:flex;flex-direction:column;gap:8px;}
.talert{background:var(--urgent);color:#fff;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:var(--shadow);}
.talert strong{display:block;font-family:var(--head);font-size:16px;}
.talert span{font-size:13px;opacity:.92;}
.talert button{border:0;background:#fff;color:var(--urgent);font-weight:700;border-radius:10px;padding:8px 14px;flex:none;}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.task input[type=checkbox]::after{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hrow"><p class="date" id="date"></p><button class="tbtn" id="tbtn" data-a="timers"></button></div>
    <div class="trow"><h1 id="title">Today's tasks</h1><div class="hbtns" id="hbtns"></div></div>
    <p class="summary" id="summary"></p>
  </header>
  <main id="main"></main>
  <p class="privacy" id="privacy">Saved on this device only. Use first names or initials for patients.</p>
</div>

<button class="fab" id="fab" aria-label="Add"></button>

<nav>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-todo" data-a="tab" data-v="todo">

function friendlyAuth(m){m=(m||"").toLowerCase();
  if(m.indexOf("already")>-1&&m.indexOf("regist")>-1)return "That username is taken — try logging in instead.";
  if(m.indexOf("invalid")>-1)return "Wrong username or password.";
  if(m.indexOf("6 char")>-1||(m.indexOf("password")>-1&&m.indexOf("short")>-1))return "Password must be at least 6 characters.";
  if(m.indexOf("fetch")>-1||m.indexOf("network")>-1||m.indexOf("failed to")>-1)return "Can't reach the server. Check your connection, or use this device only.";
  return m?(m.charAt(0).toUpperCase()+m.slice(1)+"."):"Something went wrong. Please try again.";}

function doAuth(){
  if(!sb){authErr("Server not loaded. Use this device only for now.");return;}
  var u=((aEl("au-user")||{}).value||"").trim(), p=(aEl("au-pass")||{}).value||"";
  if(u.length<3){authErr("Username must be at least 3 characters.");return;}
  if(p.length<6){authErr("Password must be at least 6 characters.");return;}
  authErr("");authBusy(true);
  var email=emailFor(u);
  var pr=authMode==="signup"?sb.auth.signUp({email:email,password:p}):sb.auth.signInWithPassword({email:email,password:p});
  pr.then(function(res){authBusy(false);
    if(res.error){authErr(friendlyAuth(res.error.message));return;}
    var user=res.data&&res.data.user;
    if(!user){authErr("Something went wrong, please try again.");return;}

    onLoggedIn(user,u);
  },function(){authBusy(false);authErr("Can't reach the server. Check your connection, or use this device only.");});
}
function onLoggedIn(user,uname){mode="cloud";currentUser={id:user.id,username:uname||userFromEmail(user.email)};hideAuth();loadCloudThenStart();}
function loadCloudThenStart(){
  var go=function(raw){applyLoadedState(raw);startApp();};

}

  catch(e){showAuth();}
}

  pts.forEach(function(p,idx){
    var meta=p.routine?"":[p.visit,p.time?fmtTime(p.time):""].filter(Boolean).join(", ");

  if(finished){out+='<div style="text-align:center;margin-top:6px"><button class="link quiet" data-a="clear-done">Clear finished patients and tasks</button></div>';}

function saveTasks(){
  var d=ui.draft;
  var secs=(d.sections||[]).map(function(sec){
    var tasks=sec.items.filter(function(i){return i.on;}).map(function(i){return mkTask(i.text);});
    return {id:uid(),title:sec.title,open:false,tasks:tasks,done:false,_empty:sec.items.length===0};
  }).filter(function(sec){return sec._empty||sec.tasks.length>0;});
  secs.forEach(function(sec){delete sec._empty;});
  if(!secs.length)return;
  if(isRoutine(d.visit)){
    var er=state.patients.filter(function(p){return p.date===ui.date&&p.routine&&p.name===d.visit;})[0];
    if(er){er.sections=(er.sections||[]).concat(secs);}
    else{var np={id:uid(),name:d.visit,routine:true,time:"",visit:"",date:ui.date,sections:secs};np.ord=smartMin(np);state.patients.push(np);}
  }else{
    var name=($("pname").value||"").trim();
    if(!name){$("pname").focus();$("pname").style.borderColor="var(--urgent)";return;}
    var time=$("ptime").value||"";
    var ex=state.patients.filter(function(p){return p.date===ui.date&&!p.routine&&p.name.toLowerCase()===name.toLowerCase();})[0];
    if(ex){ex.sections=(ex.sections||[]).concat(secs);if(time&&!ex.time)ex.time=time;}
    else{var np2={id:uid(),name:name,time:time,visit:d.visit,date:ui.date,sections:secs};np2.ord=smartMin(np2);state.patients.push(np2);}
  }
  save();closeSheet();render();
}

/* ---------- timers: Sterilization (35 sterilize + 35 dry) and Ultrasonic Cleaner (10) ---------- */
var STER_CYCLE=35*60*1000, ULTRA_CYCLE=10*60*1000;
var ICON_TIMER='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.5M9.5 3h5"/></svg>';

function sterState(){var t=state.timers.sterilization;if(!t)t=state.timers.sterilization={phase:"",endsAt:0,done:false,waitAt:0};if(t.endsAt&&!t.phase)t.phase="sterilize";return t;}
function ultraState(){var t=state.timers.ultrasonic;if(!t)t=state.timers.ultrasonic={endsAt:0,done:false};return t;}
function sterLeft(){var t=sterState();return t.endsAt?Math.max(0,t.endsAt-Date.now()):null;}
function sterRunning(){var t=sterState();return !!(t.endsAt&&!t.done&&(t.phase==="sterilize"||t.phase==="dry"));}
function sterWaiting(){return sterState().phase==="wait"&&!sterState().done;}
function ultraLeft(){var t=ultraState();return t.endsAt?Math.max(0,t.endsAt-Date.now()):null;}
function ultraRunning(){var t=ultraState();return !!(t.endsAt&&!t.done);}

function fmtLeft(ms){var sec=Math.ceil(ms/1000),m=Math.floor(sec/60),r=sec%60;return pad(m)+":"+pad(r);}
function fmtAgo(ts){var m=Math.floor(Math.max(0,Date.now()-ts)/60000);if(m<1)return "just now";if(m<60)return m+" min ago";var h=Math.floor(m/60);return h+" hr "+(m%60)+" min ago";}
function fmtAgoShort(ts){var m=Math.floor(Math.max(0,Date.now()-ts)/60000);if(m<1)return "just now";if(m<60)return m+"m ago";return Math.floor(m/60)+"h "+(m%60)+"m ago";}
function fmtUp(ms){var sec=Math.floor(Math.max(0,ms)/1000),h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),r=sec%60;return "+"+(h?h+":"+pad(m):pad(m))+":"+pad(r);}
function updateAgo(){var els=document.querySelectorAll("[data-ago]");for(var i=0;i<els.length;i++)els[i].textContent=fmtAgo(+els[i].dataset.ago);}
function clock(ts){return new Date(ts).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});}

function startSter(){var t=sterState();t.phase="sterilize";t.endsAt=Date.now()+STER_CYCLE;t.done=false;t.waitAt=0;save();refreshTimers();}
function startDrying(){var t=sterState();t.phase="dry";t.endsAt=Date.now()+STER_CYCLE;t.done=false;t.waitAt=0;save();refreshTimers();}
function resetSter(){var t=sterState();t.phase="";t.endsAt=0;t.done=false;t.waitAt=0;save();refreshTimers();}
function startUltra(){var t=ultraState();t.endsAt=Date.now()+ULTRA_CYCLE;t.done=false;save();refreshTimers();}
function resetUltra(){var t=ultraState();t.endsAt=0;t.done=false;save();refreshTimers();}
function sterPhaseName(p){return p==="sterilize"?"Sterilizing":(p==="dry"?"Drying":"");}

function renderTimerBtn(){
  var b=$("tbtn");if(!b)return;
  var st=sterState(),ut=ultraState(),attention=[],running=[];
  if(st.done)attention.push("Sterilization done");
  else if(sterWaiting())attention.push("Start drying");
  else if(sterRunning())running.push({label:sterPhaseName(st.phase)+" "+fmtLeft(sterLeft()),left:sterLeft()});
  if(ut.done)attention.push("Ultrasonic done");
  else if(ultraRunning())running.push({label:"Ultrasonic "+fmtLeft(ultraLeft()),left:ultraLeft()});
  var cls="tbtn",label="Timers";
  if(attention.length){cls+=" done";label=attention.length>1?(attention.length+" timers ready"):attention[0];}
  else if(running.length){cls+=" run";running.sort(function(a,c){return a.left-c.left;});label=running[0].label;}
  b.className=cls;b.innerHTML=ICON_TIMER+'<span>'+esc(label)+'</span>';
  b.setAttribute("aria-label",label+". Open timers.");
}
function renderAlerts(){
  var st=sterState(),ut=ultraState(),h="";
  if(st.done)h+='<div class="talert" role="alert"><div><strong>Sterilization is done</strong><span>Drying finished <em data-ago="'+st.endsAt+'">'+esc(fmtAgo(st.endsAt))+'</em> (at '+esc(clock(st.endsAt))+')</span></div><button data-a="treset" data-v="ster">Dismiss</button></div>';
  else if(sterWaiting())h+='<div class="talert" role="alert"><div><strong>Sterilizing is done</strong><span>Finished <em data-ago="'+st.waitAt+'">'+esc(fmtAgo(st.waitAt))+'</em> (at '+esc(clock(st.waitAt))+'). Start drying when ready.</span></div><button data-a="tdry">Start drying</button></div>';
  if(ut.done)h+='<div class="talert" role="alert"><div><strong>Ultrasonic cleaner is done</strong><span>Finished <em data-ago="'+ut.endsAt+'">'+esc(fmtAgo(ut.endsAt))+'</em> (at '+esc(clock(ut.endsAt))+')</span></div><button data-a="treset" data-v="ultra">Dismiss</button></div>';
  $("alerts").innerHTML=h;
}
function openTimers(){
  ui.sheet="timers";
  openSheet('<div class="sheet-head"><h2>Timers</h2><button class="close" data-a="close" aria-label="Close">&times;</button></div><p class="pmeta" style="margin:4px 0 14px">Keep this page open so a timer keeps counting. When one goes off it turns red and shows how long since.</p><div id="timerbody"></div>');
  renderTimerSheet();
}
function sterCardHtml(){
  var t=sterState(),run=sterRunning(),wait=sterWaiting(),idle=!t.endsAt&&!t.done&&!wait;
  var stepCls=function(k){if(t.done||(k==="sterilize"&&(wait||t.phase==="dry")))return " done";return t.phase===k&&run?" on":"";};
  var btns=idle?'<button class="btn" data-a="tstart" data-v="ster">Start sterilizing</button>':
    (wait?'<button class="btn ghost" data-a="treset" data-v="ster">Reset</button><button class="btn" data-a="tdry">Start drying</button>':
    (run?'<button class="btn ghost" data-a="treset" data-v="ster">Reset</button>':
    '<button class="btn ghost" data-a="treset" data-v="ster">Dismiss</button><button class="btn" data-a="tstart" data-v="ster">Start again</button>'));
  return '<section class="card tcard'+((t.done||wait)?' alarm':'')+'"><h2 class="tname">Sterilization</h2>'+
    '<p class="pmeta" style="margin:-2px 0 0">35 min sterilize, then 35 min dry (you start drying)</p>'+
    '<div class="tbig'+((t.done||wait)?' done':'')+'" data-tt="ster"></div><p class="tstat" data-ts="ster"></p>'+
    '<div class="tsteps"><div class="tstep'+stepCls("sterilize")+'"><span>Sterilize, 35 min</span><div class="tbar" aria-hidden="true"><i data-tf="ster-s"></i></div></div>'+
    '<div class="tstep'+stepCls("dry")+'"><span>Dry, 35 min</span><div class="tbar" aria-hidden="true"><i data-tf="ster-d"></i></div></div></div>'+
    '<div class="tbtns">'+btns+'</div></section>';
}
function ultraCardHtml(){
  var t=ultraState(),run=ultraRunning(),idle=!t.endsAt&&!t.done;
  var btns=idle?'<button class="btn" data-a="tstart" data-v="ultra">Start 10 min cycle</button>':
    (run?'<button class="btn ghost" data-a="treset" data-v="ultra">Reset</button>':
    '<button class="btn ghost" data-a="treset" data-v="ultra">Dismiss</button><button class="btn" data-a="tstart" data-v="ultra">Start again</button>');
  return '<section class="card tcard'+(t.done?' alarm':'')+'"><h2 class="tname">Ultrasonic Cleaner</h2>'+
    '<p class="pmeta" style="margin:-2px 0 0">10 minute cycle</p>'+
    '<div class="tbig'+(t.done?' done':'')+'" data-tt="ultra"></div><p class="tstat" data-ts="ultra"></p>'+
    '<div class="tbar" aria-hidden="true" style="margin-top:12px"><i data-tf="ultra"></i></div>'+
    '<div class="tbtns">'+btns+'</div></section>';
}
function renderTimerSheet(){var body=$("timerbody");if(!body)return;body.innerHTML=sterCardHtml()+ultraCardHtml();updateTimerSheet();}
function updateTimerSheet(){
  if(ui.sheet!=="timers")return;
  var t=sterState(),left=sterLeft(),run=sterRunning();
  var big=document.querySelector('[data-tt="ster"]'),stat=document.querySelector('[data-ts="ster"]');
  var fs=document.querySelector('[data-tf="ster-s"]'),fd=document.querySelector('[data-tf="ster-d"]');
  if(big&&fs&&fd){
    var frac=run?Math.min(1,1-left/STER_CYCLE):0,ster=0,dry=0;
    if(t.done){ster=1;dry=1;big.textContent=fmtUp(Date.now()-t.endsAt);stat.textContent="Drying finished at "+clock(t.endsAt)+". Time since it went off.";}
    else if(sterWaiting()){ster=1;big.textContent=fmtUp(Date.now()-t.waitAt);stat.textContent="Sterilizing finished at "+clock(t.waitAt)+". Tap Start drying when ready.";}
    else if(run&&t.phase==="sterilize"){ster=frac;big.textContent=fmtLeft(left);stat.textContent="Step 1 of 2: sterilizing";}
    else if(run&&t.phase==="dry"){ster=1;dry=frac;big.textContent=fmtLeft(left);stat.textContent="Step 2 of 2: drying";}
    else{big.textContent=fmtLeft(STER_CYCLE);stat.textContent="Ready to start. You'll tap Start drying after sterilizing.";}
    fs.style.width=(ster*100)+"%";fd.style.width=(dry*100)+"%";
  }
  var ut=ultraState(),uleft=ultraLeft(),urun=ultraRunning();
  var ubig=document.querySelector('[data-tt="ultra"]'),ustat=document.querySelector('[data-ts="ultra"]'),uf=document.querySelector('[data-tf="ultra"]');
  if(ubig&&uf){
    if(ut.done){uf.style.width="100%";ubig.textContent=fmtUp(Date.now()-ut.endsAt);ustat.textContent="Cycle finished at "+clock(ut.endsAt)+". Time since it went off.";}
    else if(urun){uf.style.width=Math.min(100,(1-uleft/ULTRA_CYCLE)*100)+"%";ubig.textContent=fmtLeft(uleft);ustat.textContent="Running";}
    else{uf.style.width="0";ubig.textContent=fmtLeft(ULTRA_CYCLE);ustat.textContent="Ready to start. 10 minute cycle.";}
  }
}
function refreshTimers(){renderTimerBtn();renderAlerts();if(ui.sheet==="timers")renderTimerSheet();}
function tick(){
  var changed=false,st=sterState(),ut=ultraState();
  if(sterRunning()&&Date.now()>=st.endsAt){if(st.phase==="sterilize"){st.phase="wait";st.waitAt=st.endsAt;st.endsAt=0;}else{st.done=true;}changed=true;}
  if(ultraRunning()&&Date.now()>=ut.endsAt){ut.done=true;changed=true;}
  if(changed){save();refreshTimers();}
  else{renderTimerBtn();updateTimerSheet();updateAgo();}
}

/* ---------- events ---------- */
function findTask(pid,tid){
  var arr=pid==="general"?state.general:[];
  return {arr:arr,task:arr.filter(function(t){return t.id===tid;})[0]};
}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]");if(!el)return;
  var a=el.dataset.a;
  if(a==="scrim"){if(e.target===el)closeSheet();return;}
  var v=el.dataset.v,p=el.dataset.p,t=el.dataset.t;
  switch(a){
    case "au-do":doAuth();break;
    case "au-switch":authMode=(authMode==="signup"?"login":"signup");renderAuth();var _uu=aEl("au-user");if(_uu)_uu.focus();break;
    case "au-local":useLocal();break;
    case "logout":doLogout();break;
    case "tab":ui.tab=v;ui.addingTo=null;ui.trayAdd=null;ui.secAdding=null;render();window.scrollTo(0,0);break;
    case "tray-collapse":{var tk=el.dataset.k;state.trayOpen[tk]=!state.trayOpen[tk];if(!state.trayOpen[tk]&&ui.trayAdd===tk)ui.trayAdd=null;save();render();break;}
    case "trayall":{var wo=v==="1";TRAYS.forEach(function(tr){state.trayOpen[tr.key]=wo;});save();render();break;}
    case "tray-open":ui.trayAdd=(ui.trayAdd===el.dataset.k)?null:el.dataset.k;render();if(ui.trayAdd){var tf=$("tray-text");if(tf)tf.focus();}break;
    case "tray-save":traySave(el.dataset.k);break;
    case "tray-rm":{var arr=state.trays[el.dataset.k]||[];arr.splice(+el.dataset.i,1);save();render();break;}
    case "dprev":ui.date=shiftDate(ui.date,-1);ui.addingTo=null;render();break;
    case "dnext":ui.date=shiftDate(ui.date,1);ui.addingTo=null;render();break;
    case "cal":openCal();break;
    case "calnav":{var nm=ui.calMonth.m+(+v);var ny=ui.calMonth.y;if(nm<0){nm=11;ny--;}if(nm>11){nm=0;ny++;}ui.calMonth={y:ny,m:nm};renderCal();break;}
    case "calday":ui.date=v;ui.addingTo=null;closeSheet();render();window.scrollTo(0,0);break;
    case "caltoday":ui.date=todayStr();ui.addingTo=null;if(ui.sheet)closeSheet();render();break;
    case "timers":openTimers();break;
    case "tstart":v==="ultra"?startUltra():startSter();break;
    case "treset":v==="ultra"?resetUltra():resetSter();break;
    case "tdry":startDrying();break;
    case "mfilter":ui.msgFilter=v;render();break;
    case "toggle":{var r=findTask(p,t);if(r.task){r.task.done=el.checked;save();render();}break;}
    case "rmtask":{var q=findTask(p,t);if(q.task){var idx=q.arr.indexOf(q.task);q.arr.splice(idx,1);save();render();}break;}
    case "ttoggle":{var sc=findSec(p,el.dataset.s);if(sc){var tk=sc.tasks.filter(function(x){return x.id===t;})[0];if(tk){tk.done=el.checked;save();render();}}break;}
    case "trm":{var sc2=findSec(p,el.dataset.s);if(sc2){var ti=sc2.tasks.findIndex(function(x){return x.id===t;});if(ti>-1){sc2.tasks.splice(ti,1);save();render();}}break;}
    case "sectoggle":{var sc3=findSec(p,el.dataset.s);if(sc3){var on=el.checked;if(sc3.tasks.length)sc3.tasks.forEach(function(x){x.done=on;});else sc3.done=on;save();render();}break;}
    case "secopen":{var sc4=findSec(p,el.dataset.s);if(sc4){sc4.open=!sc4.open;save();render();}break;}
    case "secadd-open":ui.secAdding=(ui.secAdding===p)?null:p;render();if(ui.secAdding){var sf=$("sec-text");if(sf)sf.focus();}break;
    case "secadd-save":secAddSave(p);break;
    case "rmpatient":{var i=state.patients.findIndex(function(x){return x.id===p;});if(i>-1){var rem=state.patients.splice(i,1)[0];lastRemoved={patient:rem,index:i};save();render();toast("Removed "+rem.name,true);}break;}
    case "undo":if(lastRemoved){state.patients.splice(lastRemoved.index,0,lastRemoved.patient);lastRemoved=null;save();$("toastbox").innerHTML="";render();}break;
    case "move":moveCard(p,+el.dataset.d);break;
    case "collapse":{var cp=state.patients.filter(function(x){return x.id===p;})[0];if(cp){cp.collapsed=!cp.collapsed;save();render();}break;}
    case "collapseall":{var want=v==="1";state.patients.filter(function(x){return x.date===ui.date;}).forEach(function(x){x.collapsed=want;});save();render();break;}
    case "inl-open":{var key=el.dataset.s||p;ui.addingTo=(ui.addingTo===key)?null:key;render();if(ui.addingTo){var f=$("inl-text");if(f)f.focus();}break;}
    case "inl-save":inlSave(p,el.dataset.s);break;
    case "clear-done":
      state.patients=state.patients.filter(function(x){if(x.date!==ui.date)return true;return !cardComplete(x);});
      state.general=state.general.filter(function(x){return !(x.date===ui.date&&x.done);});
      save();render();break;
    case "close":closeSheet();break;
    case "visit":ui.draft.visit=v;loadTemplate();renderVisitChips();renderPreview();break;
    case "pickname":$("pname").value=v;break;
    case "pv":ui.draft.sections[+el.dataset.si].items[+el.dataset.ii].on=el.checked;renderPreview();break;
    case "savetasks":saveTasks();break;
    case "urg":ui.urgent=v==="1";document.querySelectorAll('[data-a="urg"]').forEach(function(b){b.setAttribute("aria-pressed",(b.dataset.v==="1")===ui.urgent);});break;
    case "savemsg":saveMsg();break;
    case "msgrelay":{var m=state.messages.filter(function(x){return x.id===el.dataset.m;})[0];if(m){m.relayed=!m.relayed;save();render();}break;}
    case "msgdel":{var mi=state.messages.findIndex(function(x){return x.id===el.dataset.m;});if(mi>-1){state.messages.splice(mi,1);save();render();}break;}
  }
});
$("fab").addEventListener("click",function(){ui.tab==="todo"?openTaskSheet():openMsgSheet();});

document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&ui.sheet)closeSheet();
  if(e.key==="Enter"){
    if(e.target.id==="inl-text"){e.preventDefault();inlSave(e.target.dataset.p,e.target.dataset.s);}
    if(e.target.id==="sec-text"){e.preventDefault();secAddSave(e.target.dataset.p);}
    if(e.target.id==="tray-text"){e.preventDefault();traySave(e.target.dataset.k);}
    if(e.target.id==="au-pass"||e.target.id==="au-user"){e.preventDefault();doAuth();}
  }
});

function moveCard(id,dir){
  var day=state.patients.filter(function(p){return p.date===ui.date;}).sort(function(a,b){return ordKey(a)-ordKey(b);});
  var i=-1;for(var k=0;k<day.length;k++)if(day[k].id===id)i=k;
  var j=i+(dir<0?-1:1);
  if(i<0||j<0||j>=day.length)return;
  day.forEach(function(p,n){p.ord=n;});
  var t=day[i].ord;day[i].ord=day[j].ord;day[j].ord=t;
  save();render();
}
function traySave(k){
  var f=$("tray-text");if(!f)return;var txt=(f.value||"").trim();if(!txt){f.focus();return;}
  if(!state.trays[k])state.trays[k]=[];
  state.trays[k].push(txt);save();render();var nf=$("tray-text");if(nf)nf.focus();
}
function inlSave(pid,sid){
  var f=$("inl-text");if(!f)return;var txt=(f.value||"").trim();if(!txt){f.focus();return;}
  if(sid){var sec=findSec(pid,sid);if(sec){sec.open=true;sec.tasks.push(mkTask(txt));}}
  else if(pid==="general"){state.general.push({id:uid(),text:txt,done:false,date:ui.date});}
  save();render();var nf=$("inl-text");if(nf)nf.focus();
}
function secAddSave(pid){
  var f=$("sec-text");if(!f)return;var txt=(f.value||"").trim();if(!txt){f.focus();return;}
  var pt=state.patients.filter(function(x){return x.id===pid;})[0];
  if(pt){if(!pt.sections)pt.sections=[];pt.sections.push({id:uid(),title:txt,open:true,tasks:[]});}
  ui.secAdding=null;save();render();
}

boot();
})();
</script>
